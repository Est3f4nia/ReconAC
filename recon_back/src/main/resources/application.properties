spring.application.name=reconac

# ===============================
# SECURITY
# ===============================

spring.security.user.name=${SEC_NAME}
spring.security.user.password=${SEC_PASSWD}

# ===============================
# DATABASE
# ===============================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWD}

# ===============================
# JPA / HIBERNATE
# ===============================

# Hibernate solo verifica que las entidades coincidan
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ===============================
# FLYWAY
# ===============================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
logging.level.org.flywaydb=DEBUG

# ===============================
# REDIS
# ===============================

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

# Cache TTL (hours)
cache.ttl-hours=${CACHE_TTL_HOURS:24}

# ===============================
# RATE LIMITING (T7 - Bucket4j, por IP en /api/auth/**)
# ===============================

app.ratelimit.enabled=true
app.ratelimit.capacity=${RATE_LIMIT_CAPACITY:10}
app.ratelimit.refill-per-minute=${RATE_LIMIT_REFILL:10}

# ===============================
# JWT
# ===============================

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000
app.jwt.algorithm=HS256

# ===============================
# CORS
# ===============================

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}

# ===============================
# RECON MODULES (endpoints externalizados por módulo)
# ADR-013: Opción A (mapa de endpoints)
# ===============================

app.modules.recon.url=${MODULES_API_URL:http://localhost:5000}
app.modules.recon.timeout=30000