spring.application.name=reconac

# ===============================
# SECURITY
# ===============================

spring.security.user.name=${SEC_NAME:}
spring.security.user.password=${SEC_PASSWD:}

# ===============================
# DATABASE
# ===============================

spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:reconac}}
spring.datasource.username=${DB_USER:reconac}
spring.datasource.password=${DB_PASSWD}

# ===============================
# JPA / HIBERNATE
# ===============================

# Hibernate solo verifica que las entidades coincidan
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ===============================
# FLYWAY
# ===============================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
logging.level.org.flywaydb=DEBUG

# ===============================
# REDIS
# ===============================

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Cache TTL (hours)
cache.ttl-hours=${CACHE_TTL_HOURS:24}

# ===============================
# RATE LIMITING
# ===============================

app.ratelimit.enabled=true
app.ratelimit.capacity=${RATE_LIMIT_CAPACITY:10}
app.ratelimit.refill-per-minute=${RATE_LIMIT_REFILL:5}

# ===============================
# JWT
# ===============================

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000
app.jwt.algorithm=HS256

# ===============================
# CORS
# ===============================

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}
app.cookies.secure=${COOKIE_SECURE:true}

# ===============================
# RECON MODULES (endpoints externalizados por módulo)
# ADR-013: Opción A (mapa de endpoints)
# ===============================

app.modules.endpoints.recon.url=${MODULES_API_URL:http://localhost:5000}
app.modules.endpoints.recon.timeout=30000

# Encryption key: Base64-encoded AES key, kept stable with the persistent database.
nvd.encryption.key=${NVD_ENCRYPTION_KEY}

# Documentation; preserve Page<T> wire format and infer DTO/validation schemas.
springdoc.paths-to-match=/api/**
springdoc.override-with-generic-response=false
springdoc.swagger-ui.csrf.enabled=true
springdoc.swagger-ui.csrf.cookie-name=XSRF-TOKEN
springdoc.swagger-ui.csrf.header-name=X-XSRF-TOKEN
springdoc.swagger-ui.disable-swagger-default-url=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
