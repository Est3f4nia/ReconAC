# Test properties - overrides main application.properties
# Uses H2 embedded database (no Docker required)

spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# DDL via schema.sql (not Hibernate) to avoid @JdbcTypeCode conflicts with H2
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.flyway.enabled=false

# Redis - disable for tests (no Docker required)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# JWT
app.jwt.secret=reconac-test-secret-key-that-is-at-least-32-bytes-for-hs256
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000
app.jwt.algorithm=HS256

# Cache
cache.ttl-hours=1

# Rate limiting (valores altos en test para no interferir)
app.ratelimit.enabled=true
app.ratelimit.capacity=1000
app.ratelimit.refill-per-minute=1000

# Recon Modules API (ADR-013: mapa de endpoints por módulo)
app.modules.endpoints.recon.url=http://localhost:5000
app.modules.endpoints.recon.timeout=30000
