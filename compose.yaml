name: reconac
services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${DB_NAME:?Definir DB_NAME en .env raiz}
      POSTGRES_USER: ${DB_USER:?Definir DB_USER en recon_back/.env}
      POSTGRES_PASSWORD: ${DB_PASSWD:?Definir DB_PASSWD en recon_back/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  modules:
    build: ./recon_modules
    environment:
      BACKEND_API_URL: http://backend:8080
      NMAP_CMD: nmap
    depends_on:
      backend: {condition: service_healthy}
    cap_drop: [ALL]
    cap_add: [NET_RAW]
    security_opt: ["no-new-privileges:true"]
    init: true
    stop_grace_period: 40s
    restart: unless-stopped

  backend:
    build: ./recon_back
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:?Definir DB_NAME en .env raiz}
      DB_USER: ${DB_USER:?Definir DB_USER en recon_back/.env}
      DB_PASSWD: ${DB_PASSWD:?Definir DB_PASSWD en recon_back/.env}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MODULES_API_URL: http://modules:5000
      JWT_SECRET: ${JWT_SECRET:?Definir JWT_SECRET en recon_back/.env}
      NVD_ENCRYPTION_KEY: ${NVD_ENCRYPTION_KEY:?Definir NVD_ENCRYPTION_KEY en recon_back/.env}
      SEC_NAME: ${SEC_NAME:-}
      SEC_PASSWD: ${SEC_PASSWD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:${FRONTEND_PORT:-3000}}
      CACHE_TTL_HOURS: ${CACHE_TTL_HOURS:-24}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped

  frontend:
    build: ./recon_front
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend: {condition: service_healthy}
      modules: {condition: service_healthy}
    restart: unless-stopped

volumes:
  postgres_data:
